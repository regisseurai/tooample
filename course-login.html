<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academy Login — TooAmple Studios</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css?v=24">
<style>
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0d0d0d}
  .login-card{width:100%;max-width:400px;background:#161616;border:1px solid #262626;border-radius:4px;padding:36px 32px}
  .login-card h1{font-size:22px;margin:0 0 6px;color:#fff;letter-spacing:-.01em}
  .login-card p.sub{font-size:14px;color:#8a8a8a;margin:0 0 26px;line-height:1.5}
  .login-card label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8a8a8a;margin-bottom:8px}
  .login-card input{width:100%;background:#0d0d0d;border:1px solid #2e2e2e;border-radius:3px;padding:13px 14px;color:#fff;font-size:15px;font-family:inherit;letter-spacing:.04em}
  .login-card input:focus{outline:none;border-color:#c9a227}
  .login-card button{width:100%;margin-top:18px;background:#c9a227;color:#0d0d0d;border:none;border-radius:3px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .login-card button:hover{background:#dab42f}
  .login-card button:disabled{opacity:.6;cursor:default}
  .login-err{display:none;margin-top:16px;background:#2a1414;border:1px solid #4a1f1f;border-radius:3px;padding:11px 13px;font-size:13.5px;color:#e58b8b}
  .login-foot{margin-top:24px;font-size:12.5px;color:#6e6e6e;line-height:1.6}
  .login-foot a{color:#c9a227;text-decoration:none}
  .login-mark{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#c9a227;margin-bottom:22px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">TooAmple Academy</div>
    <h1>Course access</h1>
    <p class="sub">Enter the access code sent to you after enrolment.</p>
    <form id="loginForm" autocomplete="off">
      <label for="code">Access code</label>
      <input id="code" name="code" type="password" required autocapitalize="characters" spellcheck="false">
      <button type="submit" id="submitBtn">Enter course</button>
      <div class="login-err" id="err"></div>
    </form>
    <div class="login-foot">
      Lost your code? Email <a href="mailto:tooample@gmail.com">tooample@gmail.com</a>
    </div>
  </div>
</div>
<script>
const form=document.getElementById('loginForm');
const btn=document.getElementById('submitBtn');
const err=document.getElementById('err');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  err.style.display='none';
  btn.disabled=true;btn.textContent='Checking…';
  try{
    const r=await fetch('/api/course-login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:document.getElementById('code').value.trim()})
    });
    if(r.ok){window.location.href='/academy/';return;}
    const d=await r.json().catch(()=>({}));
    err.textContent=d.error||'That code was not recognised.';
    err.style.display='block';
  }catch(_){
    err.textContent='Connection problem. Please try again.';
    err.style.display='block';
  }
  btn.disabled=false;btn.textContent='Enter course';
});
</script>
</body>
</html>
